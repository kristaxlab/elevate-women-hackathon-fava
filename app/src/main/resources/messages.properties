fava.product.tagline=Save favorites. Search your catalog.

fava.dm.start=Hi — I'm Fava.\n\nI help you keep a personal Catalog of favorites in a Telegram forum group: drop links and posts into your Inbox, file them under themes, and ask natural-language questions answered only from what you saved.\n\nCatalog Setup and Inbox come next — for now, you're connected.
fava.dm.fallback=I only handle a few DM commands so far. Send /start for a short intro to Fava and personal Catalogs.
