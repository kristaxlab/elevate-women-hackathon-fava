fava.product.name=Fava
fava.product.tagline=Save favorites. Search your catalog.

fava.dm.start=Hi — I'm Fava.\n\nI help you keep a personal Catalog of favorites in a Telegram forum group: drop links and posts into your Inbox, file them under themes, and ask natural-language questions answered only from what you saved.\n\nUse the buttons below to create a new group or add me to one you already have (I'll ask for the admin rights needed for forum Catalog setup, including managing topics).\n\nAfter I'm in the group: turn on Topics (forum mode) in the group settings, then run /setup there with your Theme Topic list.
fava.dm.fallback=I only handle a few DM commands so far. Send /start for a short intro to Fava and personal Catalogs.

fava.setup.admin_nudge=I'm an admin here now.\n\nNext steps:\n1) Enable Topics (forum mode) in this group's settings if they are not on yet.\n2) As an admin, run /setup with your Theme Topics, for example:\n/setup AI, Fitness\n\nOr send /setup and reply with a comma- or newline-separated list.
fava.setup.needs_forum=This group is not forum-enabled yet, so I cannot create Inbox, Smart Search, or Theme Topics.\n\nChecklist:\n1) Open group settings\n2) Turn on Topics (forum mode)\n3) Make sure I still have admin rights including Manage topics\n4) Run /setup again with your theme list
fava.setup.not_admin=Only group admins can run /setup.
fava.setup.ask_themes=Send your Theme Topic names as a comma- or newline-separated list (example: AI, Fitness).
fava.setup.empty_themes=I need at least one Theme Topic name. Try again, for example:\n/setup AI, Fitness
fava.setup.already_configured=This Catalog is already set up. v1 does not allow running /setup again.
fava.setup.success=Catalog Setup complete.\n\nCreated Inbox, Smart Search, and Theme Topics: {0}\n\nDrop saves into Inbox and ask questions in Smart Search.
fava.setup.pre_setup_prompt=This Catalog is not set up yet. Ask a group admin to enable Topics (if needed) and run /setup with a theme list (example: /setup AI, Fitness).
