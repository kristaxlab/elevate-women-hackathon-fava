fava.product.name=Fava
fava.product.tagline=Save favorites. Search your catalog.

fava.dm.start=Hi — I'm Fava.\n\nI help you keep a personal Catalog of favorites in a Telegram forum group: drop links and posts into your Inbox, file them under themes, and ask natural-language questions answered only from what you saved.\n\nUse the buttons below to create a new group or add me to one you already have (I'll ask for the admin rights needed for forum Catalog setup, including managing topics).\n\nAfter I'm in the group: turn on Topics (forum mode) in the group settings, then run /setup there. Setup wires Theme Topics and System Topics — that step lands in a later release.
fava.dm.fallback=I only handle a few DM commands so far. Send /start for a short intro to Fava and personal Catalogs.
